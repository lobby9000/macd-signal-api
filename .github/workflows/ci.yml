name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Numerical, contract and regression tests
        run: pytest --junitxml=reports/ci/pytest.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g newman@6 newman-reporter-htmlextra@1
      - name: Postman collection with Newman
        run: scripts/run_newman.sh ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: reports/ci
